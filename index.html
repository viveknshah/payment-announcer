<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chai Stall Pay Announcer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #20242a; font-family: system-ui, "Nirmala UI", "Noto Sans Devanagari", sans-serif;
    display: flex; justify-content: center; padding: 18px 8px; color: #f5f5f5;
  }
  /* The phone frame: everything the stall owner sees lives in here */
  .phone {
    width: 100%; max-width: 380px; min-height: 720px;
    background: #10131a; border: 3px solid #3a4150; border-radius: 28px;
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .statusbar { font-size: 12px; color: #8a93a5; display: flex; justify-content: space-between; }
  h1 { font-size: 19px; text-align: center; }
  .langs { display: flex; gap: 6px; justify-content: center; }
  .langs button {
    background: #232a38; color: #cfd6e4; border: 1px solid #3a4150;
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .langs button.active { background: #2f6f4f; border-color: #2f6f4f; color: #fff; }
  .langs button .stub { font-size: 10px; color: #e0b34d; }
  .total-box { background: #17301f; border: 2px solid #2f6f4f; border-radius: 16px; padding: 14px; text-align: center; }
  .total-box .label { font-size: 13px; color: #9fd4ae; }
  .total-box .amount { font-size: 42px; font-weight: 800; line-height: 1.15; }
  .total-box .count { font-size: 14px; color: #cfe9d6; }
  .card { border-radius: 14px; padding: 12px 14px; border: 2px solid #3a4150; background: #181d27; }
  .card .amt { font-size: 30px; font-weight: 800; }
  .card .meta { font-size: 13px; color: #aab3c5; margin-top: 2px; }
  .card.credited { border-color: #2f6f4f; }
  .card.refund   { border-color: #2b5d8a; }
  .card.review   { border-color: #b58900; }
  .card.excluded { border-color: #8a2f2f; }
  .flags { margin-top: 6px; font-size: 12px; color: #e0b34d; }
  .speaker {
    border-radius: 14px; padding: 12px 14px; background: #1d2432;
    border: 2px solid #3a4150; font-size: 20px; font-weight: 600; min-height: 56px;
    display: flex; align-items: center; gap: 10px;
  }
  .speaker.speaking { border-color: #4d9de0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #3a4150; flex: none; }
  .speaking .dot { background: #4d9de0; animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { from { transform: scale(0.7); opacity: 0.5; } to { transform: scale(1.3); opacity: 1; } }
  .section-label { font-size: 12px; color: #8a93a5; text-transform: uppercase; letter-spacing: 0.06em; }
  .fixtures { display: flex; flex-direction: column; gap: 6px; max-height: 170px; overflow-y: auto; }
  .fixtures button {
    text-align: left; background: #181d27; color: #dfe5ef; border: 1px solid #3a4150;
    border-radius: 10px; padding: 8px 10px; font-size: 13px; cursor: pointer;
  }
  .fixtures button:hover { border-color: #4d9de0; }
  .fixtures button .tag { font-size: 11px; color: #8a93a5; }
  .paste { display: flex; flex-direction: column; gap: 6px; }
  .paste input {
    background: #181d27; border: 1px solid #3a4150; border-radius: 10px;
    color: #f5f5f5; padding: 9px 10px; font-size: 14px;
  }
  .actions { display: flex; gap: 8px; }
  .actions button {
    flex: 1; border: none; border-radius: 12px; padding: 13px 8px;
    font-size: 16px; font-weight: 700; cursor: pointer; color: #fff;
  }
  .primary { background: #2f6f4f; }
  .send { background: #2b5d8a; }
  .undo { background: #5a3030; flex: 0 0 70px !important; }
  .summary-box { background: #171c26; border: 2px solid #4d9de0; border-radius: 14px; padding: 12px 14px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; display: none; }
  .summary-box .engine { font-size: 11px; color: #8a93a5; display: block; margin-top: 8px; }
  .summary-box .nobreak { white-space: nowrap; }
  .engines { font-size: 11px; color: #8a93a5; text-align: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>stall-phone</span><span id="clock"></span></div>
  <h1>चाय की दुकान · Pay Announcer</h1>
  <div class="langs" id="langs"></div>

  <div class="total-box">
    <div class="label">आज का कुल · Today's total</div>
    <div class="amount">₹<span id="total">0</span></div>
    <div class="count"><span id="count">0</span> payments · <span id="review">0</span> to check · <span id="refunds">0</span> refunds</div>
  </div>

  <div class="speaker" id="speaker"><div class="dot"></div><span id="saytext"> waiting for payments…</span></div>

  <div id="card" class="card" style="display:none">
    <div class="amt" id="card-amt"></div>
    <div class="meta" id="card-meta"></div>
    <div class="flags" id="card-flags"></div>
  </div>

  <div class="section-label">Incoming SMS (demo feed)</div>
  <div class="fixtures" id="fixtures"></div>

  <div class="section-label">Or paste an SMS</div>
  <div class="paste">
    <input id="in-sender" placeholder="Sender (e.g. VK-BOBSMS)">
    <input id="in-body" placeholder="Message text">
    <button class="send" id="btn-send" style="border:none;border-radius:12px;padding:11px;font-size:15px;font-weight:700;color:#fff;cursor:pointer">Feed SMS</button>
  </div>

  <div class="actions">
    <button class="primary" id="btn-eod">End of day · दिन का हिसाब</button>
    <button class="undo" id="btn-undo">Undo</button>
  </div>

  <div class="summary-box" id="summary"></div>
  <div class="engines" id="engines"></div>
</div>

<script>
let lastAnnTs = 0;

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

async function api(path, body) {
  const opt = body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  return r.json();
}

async function refresh() {
  try {
    const s = await api('/api/state');
    document.getElementById('total').textContent = s.total;
    document.getElementById('count').textContent = s.count;
    document.getElementById('review').textContent = s.review_count;
    document.getElementById('refunds').textContent = s.refund_count;

    const sp = document.getElementById('speaker');
    document.getElementById('saytext').textContent = s.announcement.text || ' waiting for payments…';
    sp.classList.toggle('speaking', !!s.speaking);

    const card = document.getElementById('card');
    if (s.last_payment) {
      card.style.display = 'block';
      card.className = 'card ' + s.last_payment.status;
      document.getElementById('card-amt').textContent =
        (s.last_payment.status === 'credited' ? '₹' + s.last_payment.amount + ' received' :
         s.last_payment.status === 'refund' ? '₹' + s.last_payment.amount + ' refund' :
         s.last_payment.status === 'excluded' ? 'Not counted' : 'Needs checking');
      document.getElementById('card-meta').textContent =
        [s.last_payment.payer ? 'from ' + s.last_payment.payer : '',
         s.last_payment.ref ? 'ref ' + s.last_payment.ref : '',
         s.last_payment.source].filter(Boolean).join(' · ');
      const flags = [];
      if (s.last_payment.duplicate) flags.push('DUPLICATE - already counted');
      if (s.last_payment.large) flags.push('LARGE AMOUNT - verify in bank app');
      if (s.last_payment.needs_review && s.last_payment.reason) flags.push(s.last_payment.reason);
      document.getElementById('card-flags').textContent = flags.join(' · ');
    } else {
      card.style.display = 'none';
      document.getElementById('card-flags').textContent = '';
    }

    const langs = document.getElementById('langs');
    langs.innerHTML = '';
    for (const l of s.languages) {
      const b = document.createElement('button');
      b.innerHTML = esc(l.name) + (l.stub ? ' <span class="stub">stub</span>' : '');
      b.className = l.code === s.lang ? 'active' : '';
      b.onclick = () => api('/api/lang', {code: l.code}).then(refresh);
      langs.appendChild(b);
    }
    document.getElementById('engines').textContent =
      'voice: ' + (s.engines.piper ? 'Piper (offline)' : 'fallback (OS voice / text)') +
      ' · summary: ' + (s.engines.ollama ? 'Gemma via Ollama' : 'template fallback');
  } catch (e) { /* server restarting */ }
}

// A summary is a snapshot. Once the ledger changes, it is out of date, so
// drop it rather than leave yesterday's totals on screen next to today's.
function clearSummary() {
  const box = document.getElementById('summary');
  box.style.display = 'none';
  box.textContent = '';
}

async function loadFixtures() {
  const data = await api('/api/fixtures');
  const box = document.getElementById('fixtures');
  data.fixtures.forEach((f) => {
    const b = document.createElement('button');
    b.innerHTML = esc(f.body.slice(0, 64)) + (f.body.length > 64 ? '…' : '') +
                  '<br><span class="tag">' + esc(f.sender) + '</span>';
    b.onclick = () => api('/api/feed', {sender: f.sender, body: f.body})
      .then(() => { clearSummary(); refresh(); });
    box.appendChild(b);
  });
}

document.getElementById('btn-send').onclick = () => {
  const sender = document.getElementById('in-sender').value || 'PASTED';
  const body = document.getElementById('in-body').value;
  if (body.trim()) api('/api/feed', {sender, body}).then(() => { clearSummary(); refresh(); });
  document.getElementById('in-body').value = '';
};
// Keep bill dates from splitting across lines ("2026-10-" / "25").
function withDates(s) {
  return esc(s).replace(/(\d{4}-\d{2}-\d{2})/g, '<span class="nobreak">$1</span>');
}
document.getElementById('btn-eod').onclick = async () => {
  const btn = document.getElementById('btn-eod');
  const box = document.getElementById('summary');
  // A local model needs ~15s on a laptop CPU; say so instead of going blank.
  btn.disabled = true;
  btn.textContent = '…';
  box.style.display = 'block';
  box.textContent = 'सारांश तैयार हो रहा है…';
  try {
    const r = await api('/api/summary', {});
    box.innerHTML = withDates(r.text) + '\n\n' + withDates(r.bills_text) +
      '<span class="engine">summary engine: ' + esc(r.engine) + '</span>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'End of day · दिन का हिसाब';
    refresh();
  }
};
document.getElementById('btn-undo').onclick = () => api('/api/undo', {})
  .then(() => { clearSummary(); refresh(); });

setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
loadFixtures();
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
